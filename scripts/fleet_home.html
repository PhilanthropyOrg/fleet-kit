<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet</title>
<!--
  fleet_home.html -- Console v3 (fk#1058). The 990 Scout superadmin sidebar shell (Reif,
  2026-09-15: "borrow from the templates copy from nonprofitatlas - its got a sidebar admin
  template that is pretty good"), operator purple, Inter, tabular numbers.

  Three pages, one file, no framework, no build step: Home (tiles + agents + landed today),
  Roster (every member in unison, plain English, grouped by the value stage it serves, so a
  hole shows up as a stage with nobody in it), and the run panel (fk#748). Every tile is a
  row in scripts/metrics.json with a real id, a value and a hoverable sparkline; the OKR file
  references tiles by id. No inbox block (#1054): an ask pages Reif.

  Polls the existing JSON endpoints every 30s. Served behind a path prefix; every URL goes
  through withBase() (gh#553).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1c19;--ink-2:#3a3f3a;--muted:#6b736b;--faint:#8b9188;
    --paper:#fff;--tint:#f5f7f3;--tint-2:#eef1ea;--rule:#e6e9e4;
    --accent:#635bff;--accent-soft:#f0ebff;
    --ok:#1f8b4c;--warn:#a6720f;--bad:#c13a2e;--off:#b9bcc2;
    --shadow:0 1px 3px rgba(0,0,0,.06);
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{--ink:#eceef2;--ink-2:#c9cdd4;--muted:#a2a8b3;--faint:#7d838e;--paper:#1b1d21;--tint:#15171b;--tint-2:#262930;--rule:#2f333a;--accent:#8f88ff;--accent-soft:#2a2750;--off:#4b4f57;--shadow:0 1px 3px rgba(0,0,0,.4)}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--tint);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .layout{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .sidebar{background:var(--paper);border-right:1px solid var(--rule);padding:24px;display:flex;flex-direction:column;gap:6px}
  .brand{display:flex;align-items:baseline;gap:4px}
  .brand-mark{font:700 15px var(--sans);letter-spacing:-.02em;color:var(--accent)}
  .brand-word{font:700 15px var(--sans);letter-spacing:.08em}
  .brand-env{display:block;font:500 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:2px 0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sec{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:12px 0 4px}
  .nav{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;font-size:13px;color:var(--ink);cursor:pointer;min-height:36px}
  .nav:hover{background:var(--tint);text-decoration:none}
  .nav.active{background:var(--accent-soft);border-left:3px solid var(--accent);padding-left:5px;font-weight:600}
  .nav .cnt{margin-left:auto;font:500 11px var(--mono);color:var(--muted);background:var(--tint-2);padding:1px 6px;border-radius:10px}
  .nav .cnt.bad{background:var(--bad);color:#fff}
  .sidebar-foot{margin-top:auto;font-size:12px;color:var(--faint);padding-top:16px;border-top:1px solid var(--rule);line-height:1.7}
  .header{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--rule);padding:14px 32px;background:var(--paper)}
  .header h1{font:600 18px var(--sans);letter-spacing:-.01em;margin:0}
  .util{margin-left:auto;display:flex;align-items:center;gap:16px}
  .util a{font:500 13px var(--sans);color:var(--muted)}
  .toggle{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--sans);cursor:pointer;background:none;border:0;color:var(--ink);padding:0;min-height:36px}
  .toggle .sw{width:34px;height:20px;border-radius:10px;background:var(--off);position:relative;transition:background .15s}
  .toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on .sw{background:var(--ok)} .toggle.on .sw::after{left:16px}
  .main{padding:24px 32px 48px;display:flex;flex-direction:column;gap:24px;min-width:0}
  .banner{border-radius:8px;padding:12px 16px;font-weight:700;font-size:16px;background:#fff4e5;color:#7a4b00;border:1px solid #f3d9a4}
  .banner.paused{background:var(--bad);color:#fff;border-color:var(--bad)}
  .banner small{display:block;font-weight:500;font-size:13px;margin-top:4px;opacity:.95}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .stat{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 16px;box-shadow:var(--shadow);min-width:0}
  .stat .l{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .stat .v{font:600 24px var(--sans);letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat .v small{font:500 13px var(--sans);color:var(--muted);letter-spacing:0}
  .stat .v.bad{color:var(--bad)} .stat .v.ok{color:var(--ok)}
  .stat .s{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spark{position:relative;margin-top:8px;height:38px}
  .spark svg{display:block;width:100%;height:38px;overflow:visible}
  .spark .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .spark .area{fill:var(--accent);opacity:.10}
  .spark .end{fill:var(--accent);stroke:var(--paper);stroke-width:2}
  .spark .cross{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 2;display:none}
  .spark .pt{fill:var(--accent);stroke:var(--paper);stroke-width:2;display:none}
  .spark .tip{position:absolute;top:-30px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:500 11px var(--mono);padding:3px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;display:none;z-index:2}
  .spark:hover .cross,.spark:hover .pt,.spark:hover .tip{display:block}
  .spark .none{font:500 11px var(--mono);color:var(--faint);padding-top:12px}
  .stat .rng{font:500 10px var(--mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat .rng .mid{text-transform:none;letter-spacing:0;color:var(--muted)}
  .card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
  .card-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
  .card-head h2{font:600 14px var(--sans);margin:0}
  .card-head .sub{color:var(--muted);font-size:12px}
  .card-head .right{margin-left:auto;font-size:12px}
  .two{display:grid;grid-template-columns:3fr 2fr;gap:24px}
  .wrap{overflow-x:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);text-align:left;padding:8px 16px;border-bottom:1px solid var(--rule);white-space:nowrap}
  .tbl td{padding:9px 16px;border-bottom:1px solid var(--rule);vertical-align:middle;font-variant-numeric:tabular-nums}
  .tbl tr:last-child td{border-bottom:0}
  .tbl .num{text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
  .tbl tr.agent{cursor:pointer} .tbl tr.agent:hover td{background:var(--tint)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;background:var(--off)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .name{font-weight:600;white-space:nowrap} .role{color:var(--muted);font-size:12px}
  .tbl td.when{white-space:nowrap}
  .pill{display:inline-block;font:500 11px var(--sans);padding:2px 8px;border-radius:10px;background:var(--tint-2);color:var(--ink-2);white-space:nowrap}
  .pill.bad{background:#fbe9e7;color:#8f2a20} .pill.ok{background:#e3f3e9;color:#1a5d36} .pill.warn{background:#fbf1d9;color:#6d4a05}
  .drawer td{background:var(--tint)}
  .drawer .role-label{display:block;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .drawer .run{padding:4px 0;border-top:1px solid var(--rule);cursor:pointer} .drawer .run:first-child{border-top:0}
  .drawer .run:hover{background:var(--tint-2)}
  .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  button,a.btn{font:inherit;font-size:13px;font-weight:600;min-height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--bad);border-color:var(--bad)}
  button:disabled{opacity:.5}
  .err{color:var(--bad);font-size:12px}
  .empty{color:var(--muted);padding:12px 16px}
  .landed{list-style:none;margin:0;padding:0}
  .landed li a{display:flex;gap:12px;padding:9px 16px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink)}
  .landed li:last-child a{border-bottom:0}
  .landed .who{color:var(--muted);font-family:var(--mono);font-size:12px;margin-left:auto;white-space:nowrap}
  /* roster */
  .stage{margin-bottom:8px}
  .stage-head{display:flex;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--tint)}
  .stage-head h3{font:600 13px var(--sans);margin:0;text-transform:uppercase;letter-spacing:.06em}
  .stage-head .q{color:var(--muted);font-size:12px}
  .stage-head .hole{margin-left:auto}
  .member{display:grid;grid-template-columns:200px 1fr 130px;gap:16px;padding:10px 16px;border-bottom:1px solid var(--rule);align-items:center}
  .member:last-child{border-bottom:0}
  .member .plain{color:var(--ink-2)}
  .member .when{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
  /* run panel (fk#748) */
  .side-back{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:40}
  .side{position:fixed;top:0;right:0;bottom:0;width:33.333vw;min-width:360px;max-width:640px;background:var(--paper);border-left:1px solid var(--rule);box-shadow:-12px 0 32px rgba(0,0,0,.12);z-index:41;overflow-y:auto;padding:16px 18px 40px;transform:translateX(100%);transition:transform .18s ease-out}
  .side.in{transform:none}
  .side .top{display:flex;align-items:flex-start;gap:10px} .side .top .name{font-size:18px}
  /* a quiet icon button, not a bordered box (Reif 2026-09-16: "this button looks terrible") */
  .side .top .close{margin-left:auto;flex:0 0 auto;width:28px;height:28px;min-width:0;padding:0;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:20px;line-height:28px;text-align:center;cursor:pointer}
  .side .top .close:hover{background:var(--tint-2);color:var(--ink)}
  .side .top .close:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
  .side .when{color:var(--muted);font-size:13px;margin:2px 0 12px}
  .side .txt.plain{font-size:15px;line-height:1.5;color:var(--ink);white-space:pre-line}
  .side .badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--muted)}
  .side .badge.ok{color:var(--ok)} .side .badge.warn{color:var(--warn)} .side .badge.bad{color:var(--bad)}
  .side h2{font:600 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
  .side .txt{font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
  .side .txt.report{border-left:3px solid var(--accent);padding-left:10px}
  .side .none{color:var(--muted);font-style:italic;font-size:14px}
  .side .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px} .side .facts dt{color:var(--muted)} .side .facts dd{margin:0}
  /* The run id is the only handle a human has on one pass -- it is what you paste into a
     grep of the logs, or into a message to another agent. It was plain dim text, so the
     only way to get it was a hand selection that kept missing the last character. */
  .side .runid{display:inline-flex;align-items:center;gap:6px;font:12px/1.3 var(--mono);color:var(--muted);background:var(--chip,#f4f5f7);border:1px solid var(--line,#e3e5e9);border-radius:5px;padding:2px 6px;cursor:pointer;overflow-wrap:anywhere;text-align:left}
  .side .runid:hover{color:var(--ink);border-color:var(--accent)}
  .side .runid .rc{font:11px var(--mono);color:var(--faint);flex:none}
  /* "Self-critique: none" is not a clean run, it is a run that did not look. Render it as the
     miss it is rather than as a tidy green fact (Reif, 2026-09-18: "no such thing as a clean
     run, something needs to improve each run"). */
  .side .txt.nocrit{border-left:3px solid var(--warn,#b8860b);padding-left:10px;color:var(--muted)}
  .side .critflag{margin-top:6px;font-size:12.5px;color:var(--warn,#b8860b)}
  .side pre.live{font:12px/1.5 var(--mono);background:var(--tint);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;max-height:40vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
  @media (max-width:760px){
    /* fk: a 1fr grid track still has min-width:auto, so any nowrap child (the brand row, the header's util span) widened the page to ~667px on a 390px phone and every tile was cut off on the right. minmax(0,1fr) + min-width:0 on the three regions lets them shrink. */
    .layout{grid-template-columns:minmax(0,1fr)}
    .sidebar,.header,.main{min-width:0;max-width:100vw;box-sizing:border-box}
    .brand{flex:0 0 auto}
    .header{flex-wrap:wrap;gap:8px 16px}
    .util{margin-left:0;flex-wrap:wrap;gap:10px 16px}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sidebar{flex-direction:row;flex-wrap:wrap;gap:4px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--rule)}
    .sec,.sidebar-foot,.brand-env{display:none} .brand{width:100%;margin-bottom:6px}
    .nav{padding:6px 10px;min-height:44px}
    .main{padding:16px} .two{grid-template-columns:1fr} .header{padding:12px 16px}
    .member{grid-template-columns:1fr;gap:4px} .member .when{text-align:left}
    .side{width:100vw;min-width:0;max-width:none;padding:14px 14px 40px}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">◆</span><span class="brand-word">FLEET</span></div>
    <span class="brand-env" id="brandEnv">console</span>
    <div class="sec">Run</div>
    <a class="nav active" data-page="home" href="#home"><span>▣</span>Home</a>
    <a class="nav" data-page="roster" href="#roster"><span>◉</span>Roster<span class="cnt" id="cntMembers">–</span></a>
    <a class="nav" id="navPrs" href="#" target="_blank"><span>⇅</span>Pull requests<span class="cnt" id="cntPrs">–</span></a>
    <a class="nav" id="navBacklog" href="#" target="_blank"><span>▤</span>Backlog<span class="cnt" id="cntBacklog">–</span></a>
    <div class="sec">Spend</div>
    <a class="nav" id="navAccounts" href="#home"><span>◐</span>Accounts<span class="cnt" id="cntAccounts">–</span></a>
    <a class="nav" id="navClassicStats" href="#"><span>$</span>Budget and stats</a>
    <div class="sidebar-foot"><a id="navClassic" href="#">Classic console</a><br><a id="navSettings" href="#">Settings and sign in</a><br><a id="navStatus" href="#">Status</a><br><span id="updated"></span></div>
  </aside>
  <div>
    <header class="header">
      <h1 id="pageTitle">Home</h1>
      <div class="util">
        <span id="build" style="font:500 12px var(--mono);color:var(--faint)"></span>
        <button class="toggle" id="fleetToggle" data-act="fleet" title="Turn the whole fleet on or off">Fleet <span class="sw"></span></button>
      </div>
    </header>
    <main class="main">
      <div id="banner"></div>
      <section id="pageHome">
        <div class="stats" id="stats"><div class="empty">loading…</div></div>
        <div class="two" style="margin-top:24px">
          <div class="card">
            <div class="card-head"><h2>Agents</h2><span class="sub">last 6h</span><a class="right" href="#roster">roster</a></div>
            <div class="wrap"><table class="tbl" id="agents"><tbody><tr><td class="empty">loading…</td></tr></tbody></table></div>
          </div>
          <div class="card">
            <div class="card-head"><h2>Landed today</h2><span class="sub" id="landedSub"></span><a class="right" id="landedAll" href="#" target="_blank">all merged</a></div>
            <ul class="landed" id="landed"><li class="empty">loading…</li></ul>
          </div>
        </div>
        <div class="card" style="margin-top:24px">
          <div class="card-head"><h2>Minion runs</h2><span class="sub" id="minionSub"></span><a class="right" href="/classic#minion">all runs</a></div>
          <ul class="landed" id="minionRuns"><li class="empty">loading…</li></ul>
        </div>
      </section>
      <section id="pageRoster" hidden>
        <div class="card" id="roster"><div class="empty">loading…</div></div>
      </section>
    </main>
  </div>
</div>
<div id="sideBack" class="side-back" hidden></div>
<aside id="side" class="side" hidden aria-label="run details"></aside>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => (v === null || v === undefined) ? '--' : '$' + Number(v).toLocaleString('en-US', {maximumFractionDigits: 2});
const num = v => (v === null || v === undefined) ? '--' : Number(v).toLocaleString('en-US');
const ago = ts => { if (!ts) return 'never'; const s = Math.max(0, Date.now()/1000 - ts);
  return s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s/60)}m ago` : s < 86400 ? `${Math.round(s/3600)}h ago` : `${Math.round(s/86400)}d ago`; };
const centralDay = d => new Intl.DateTimeFormat('en-CA', {timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit'}).format(d);
const ctTime = () => new Date().toLocaleTimeString('en-US', {timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit'}) + ' CT';

// gh#553: served behind a path prefix; every URL resolves from the document's own path.
const BASE_PATH = (() => { const p = location.pathname; return p.endsWith('/') ? p : p + '/'; })();
const withBase = path => BASE_PATH + String(path).replace(/^\//, '');
async function getJSON(path) { const r = await fetch(withBase(path), {cache: 'no-store'}); if (!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }
async function postJSON(path, body) {
  const r = await fetch(withBase(path), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error('sign in first (Settings on the classic console)');
  if (!r.ok || j.ok === false) throw new Error(j.error || `${path} ${r.status}`);
  return j;
}

let OPEN = null, OPEN_RUN = null, LIVE_TIMER = null;
let PAGE = (location.hash.replace('#', '') === 'roster') ? 'roster' : 'home';
// A run id in the URL opens that run's panel on load, so a pasted link lands a second human
// (or a second session) on the exact pass being discussed, not on the home page.
function runFromHash() { const m = location.hash.match(/(?:^|[#&])run=([^&]+)/); return m ? decodeURIComponent(m[1]) : null; }
let STATE = { members: [], runs: [], gh: {}, kpi: {}, build: null, fleet: null, metrics: [] };

// Two waves (gh#553 round 2): the tiles and the banner draw off the first, everything else off the second.
async function load() {
  const [snap, fleet, metrics] = await Promise.all([
    getJSON('/api/snapshot').catch(() => ({runs: [], gh: {}})),
    getJSON('/api/fleet_state').catch(() => null),
    getJSON('/api/metrics').catch(() => ({metrics: []})),
  ]);
  STATE = { ...STATE, runs: snap.runs || [], gh: snap.gh || {}, fleet, metrics: metrics.metrics || [] };
  renderChrome(); renderBanner(); renderStats();
  // A deep-linked run opens as soon as the runs themselves land (wave one), not after the
  // roster does -- the whole point of the link is that the reader arrives ON the pass.
  if (!OPEN_RUN) { const r = runFromHash(); if (r) { OPEN_RUN = r; renderRun(); } }
  const [members, kpi, build] = await Promise.all([
    getJSON('/api/members').catch(() => ({members: []})),
    getJSON('/api/kpi').catch(() => ({kpi: []})),
    getJSON('/api/build').catch(() => null),
  ]);
  STATE = { ...STATE, members: members.members || [], kpi: Object.fromEntries((kpi.kpi || []).map(k => [k.member, k])), build };
  renderChrome(); renderAgents(); renderLanded(); renderMinionRuns(); renderRoster();
}

function metric(id) { return STATE.metrics.find(m => m.id === id) || null; }
function poolPause() { const p = STATE.fleet && STATE.fleet.POOL_PAUSE; return (p && p.paused) ? p : null; }
function pausedResumesCT(p) {
  if (!p.resumes_at) return 'unknown';

// ---- tiles: one per metrics.json row; value, sub, sparkline with hover, the id underneath.
function sparkHtml(m) {
  const pts = (m.series || []).filter(p => p.value !== null && p.value !== undefined);
  if (pts.length < 2) return `<div class="spark"><div class="none">${pts.length ? 'history starts today' : 'no history yet'}</div></div>`;
  const v = pts.map(p => Number(p.value)), n = v.length, W = 200, H = 38, pad = 3;
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
  const x = i => pad + i * (W - 2 * pad) / (n - 1), y = k => H - pad - (k - lo) * (H - 2 * pad) / span;
  const path = v.map((k, i) => `${x(i).toFixed(1)},${y(k).toFixed(1)}`).join(' ');
  return `<div class="spark" data-id="${esc(m.id)}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polygon class="area" points="${x(0)},${H} ${path} ${x(n - 1)},${H}"/>
      <polyline class="line" points="${path}"/>
      <line class="cross" x1="0" x2="0" y1="0" y2="${H}"/>
      <circle class="pt" r="3.5"/>
      <circle class="end" r="3" cx="${x(n - 1)}" cy="${y(v[n - 1])}"/>
    </svg><div class="tip"></div></div>`;
}
function fmtValue(m) {
  if (m.value === null || m.value === undefined) return '--';
  return m.unit === 'USD' ? money(m.value) : num(m.value);
}
function renderStats() {
  const ms = STATE.metrics;
  if (!ms.length) { $('stats').innerHTML = `<div class="empty">no metrics registered (scripts/metrics.json)</div>`; return; }
  $('stats').innerHTML = ms.map(m => {
    let cls = '', v = fmtValue(m);
    if (m.id === 'okr.verified_claims' && m.target) v += ` <small>of ${num(m.target)}</small>`;
    if (m.id === 'fleet.accounts_live') { v = `${num(m.value)} <small>of ${num(m.of)}</small>`; cls = m.paused ? 'bad' : ''; }
    if (m.id === 'fleet.merged_per_day' && m.value > 0) cls = 'ok';
    if (m.bad) cls = 'bad';
    if (m.id === 'fleet.ok_runs_per_hour') { const p = poolPause(); if (p) { v = 'PAUSED'; cls = 'bad'; } else if (m.newest_ok_ts) { v = esc(ago(m.newest_ok_ts)); cls = 'ok'; } }
    const sub = (m.id === 'fleet.ok_runs_per_hour' && !poolPause()) ? 'newest ok run, any agent' : (m.sub || '');
    return `<div class="stat" data-metric-id="${esc(m.id)}">
      <div class="l">${esc(m.label)}</div>
      <div class="v ${cls}">${v}${m.stale ? ' <small class="err">stale</small>' : ''}</div>
      <div class="s" title="${esc(m.note || sub)}">${esc(sub)}</div>
      ${sparkHtml(m)}
      <div class="rng">${esc(m.window || '')} · <span class="mid">${esc(m.id)}</span></div>
    </div>`;
  }).join('');
  document.querySelectorAll('.spark[data-id]').forEach(el => {
    const m = metric(el.dataset.id); const pts = (m.series || []).filter(p => p.value !== null && p.value !== undefined);
    const svg = el.querySelector('svg'), cross = el.querySelector('.cross'), pt = el.querySelector('.pt'), tip = el.querySelector('.tip');
    const n = pts.length, W = 200, H = 38, pad = 3, v = pts.map(p => Number(p.value));
    const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
    const x = i => pad + i * (W - 2 * pad) / (n - 1), y = k => H - pad - (k - lo) * (H - 2 * pad) / span;
    el.addEventListener('mousemove', e => {
      const r = svg.getBoundingClientRect(); const i = Math.max(0, Math.min(n - 1, Math.round((e.clientX - r.left) / r.width * (n - 1))));
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); pt.setAttribute('cx', x(i)); pt.setAttribute('cy', y(v[i]));
      const label = String(pts[i].day).startsWith('-') ? `${pts[i].day}` : new Date(pts[i].day + 'T12:00:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
      tip.textContent = `${label} · ${m.unit === 'USD' ? money(v[i]) : num(v[i])}`; tip.style.left = (x(i) / W * 100) + '%';
    });
  });
}

// ---- agents: per member, last run + 6h outcome counts, click for the drawer.
function lastRuns(name) { return STATE.runs.filter(r => r.member === name).sort((a, b) => (b.ts || 0) - (a.ts || 0)); }

  const cut = Date.now() / 1000 - 6 * 3600, c = {ok: 0, declined: 0, bad: 0};
  for (const r of STATE.runs) { if (r.member !== name || (r.ts || 0) < cut) continue;
    if (r.status === 'ok') c.ok++; else if (r.status === 'budget_declined') c.declined++;

  return c;
}
function dotClass(run, enabled) {
  if (!enabled && !(run && Date.now()/1000 - (run.ts || 0) < 6 * 3600)) return '';
  if (!run) return '';
  const s = run.status || '';
  if (s === 'ok') return 'ok';
  if (['killed', 'timed_out', 'failed', 'error', 'reported_nothing', 'incomplete_fanout', 'report_lost'].includes(s) || (run.exit_code && run.exit_code !== 0)) return 'bad';
  return 'warn';
}
function pillFor(c, enabled) {

  if (c.declined + c.bad >= 5 && c.declined + c.bad >= c.ok / 2) return `<span class="pill bad">churning</span>`;
  if (c.declined + c.bad > 0) return `<span class="pill warn">${c.declined ? `declined ${c.declined}` : `failed ${c.bad}`}</span>`;
  if (c.ok > 0) return `<span class="pill ok">steady</span>`;
  return `<span class="pill">quiet</span>`;
}
function renderAgents() {
  const ms = STATE.members, tb = $('agents').querySelector('tbody');
  if (!ms.length) { tb.innerHTML = `<tr><td class="empty">No agents found.</td></tr>`; return; }
  const ranked = ms.map(m => ({m, last: lastRuns(m.spec.name)[0] || null})).sort((a, b) => ((b.last && b.last.ts) || 0) - ((a.last && a.last.ts) || 0));
  tb.innerHTML = `<tr><th>Member</th><th>Last run</th><th class="num">ok</th><th class="num">declined</th><th class="num">failed</th><th></th></tr>` + ranked.map(({m, last}) => {
    const name = m.spec.name, enabled = !!m.effective.enabled, c = counts6h(name), open = OPEN === name;
    const runs = open ? lastRuns(name).slice(0, 6) : [];
    return `<tr class="agent" data-agent="${esc(name)}">
        <td><span class="dot ${dotClass(last, enabled)}"></span><span class="name">${esc(m.spec.emoji || '')} ${esc(name)}</span><div class="role">${esc(m.spec.plain || (m.spec.mandate || {}).target || '')}</div></td>
        <td class="when">${last ? `${esc(ago(last.ts))} · ${esc(last.status || '')}` : 'never run'}</td>
        <td class="num">${c.ok}</td><td class="num">${c.declined}</td><td class="num">${c.bad}</td>
        <td>${pillFor(c, enabled)}</td></tr>` +
      (open ? `<tr class="drawer"><td colspan="6">
          ${runs.map(r => `<div class="run" data-run="${esc(r.run_id || '')}"><span class="dot ${dotClass(r, true)}"></span>${esc(ago(r.ts))} · ${esc(r.status || '')}${r.pr ? ` · PR ${esc(r.pr)}` : ''}<br><span class="role">${esc(String(r.outcome || '').slice(0, 200))}</span></div>`).join('') || '<div class="role">no runs yet</div>'}
          <div class="btns">
            <button class="primary" data-act="rerun" data-member="${esc(name)}">Rerun now</button>
            <button class="${enabled ? 'danger' : ''}" data-act="toggle" data-member="${esc(name)}" data-on="${enabled}">${enabled ? 'Pause' : 'Resume'}</button>
          </div><div class="err" data-act="err"></div></td></tr>` : '');
  }).join('');
}

// ---- fk#748: the run panel.
function linkify(text) { const base = repoBase(), h = esc(text); return base ? h.replace(/(^|[^\w/&])#(\d{2,6})\b/g, (m, pre, n) => `${pre}<a href="${base}/issues/${n}" target="_blank">#${n}</a>`) : h; }
function statusClass(rec) { const st = rec && rec.status; if (!st || st === 'started') return ''; if (st === 'ok') return 'ok'; if (st === 'quiet' || st === 'budget_declined' || st === 'reported_nothing') return 'warn'; return 'bad'; }
function findRun(id) { const all = STATE.runs.filter(r => r.run_id === id); return all.find(r => r.status !== 'started') || all[0] || null; }
function section(title, text, cls) { return `<h2>${esc(title)}</h2>${text ? `<div class="txt ${cls || ''}">${linkify(text)}</div>` : `<div class="none">none</div>`}`; }
// Reif, 2026-09-18: "no such thing as a 'clean' run, something needs to improve each run" and
// "if you are critiquing and not making changes, then you are a soap opera, lots of words said,
// no change." Both land on the same field. A pass that writes `Self-critique: none -- clean
// single-pass verdict` did not look; a pass that writes a paragraph of regret and changes
// nothing is worse, because it reads as diligence. So this section grades on a REFERENCE --
// an issue, a PR, or a file the pass actually edited -- not on the presence of words. 195
// self-critiques across six members in one week produced no traceable change; that is the
// pattern being killed here.
const CRIT_NONE = /^(none|n\/a|nothing|no findings?|clean)\b[\s\S]{0,60}$/i;

// edited. Anything else is a sentence.
const CRIT_REF = /(^|[^\w/])#\d{2,6}\b|\/(?:pull|issues)\/\d+|[\w.\-\/]+\.(?:py|sh|md|html|js|json|ya?ml)(?::\d+)?/;
function critiqueState(text) {
  const t = (text || '').trim();
  if (!t || CRIT_NONE.test(t)) return 'empty';
  return CRIT_REF.test(t) ? 'changed' : 'said';
}
function critiqueSection(text) {
  const state = critiqueState(text);
  if (state === 'changed') return `<h2>What it improved</h2><div class="txt">${linkify(text.trim())}</div>`;
  if (state === 'said') return `<h2>What it improved</h2><div class="txt nocrit">${linkify(text.trim())}<div class="critflag">Said, not done — no issue, PR or file behind it. A critique with nothing to point at did not change anything.</div></div>`;
  return `<h2>What it improved</h2><div class="txt nocrit">This pass improved nothing about itself, and named nothing to improve. Every run should leave one concrete change behind — a filed issue, a PR, or an edit to its own charter or script.</div>`;
}
function renderRun() {
  const side = $('side'), back = $('sideBack');
  const rec = OPEN_RUN && findRun(OPEN_RUN);
  if (!rec) { side.hidden = true; back.hidden = true; side.classList.remove('in'); if (LIVE_TIMER) { clearInterval(LIVE_TIMER); LIVE_TIMER = null; } return; }
  const m = STATE.members.find(x => x.spec.name === rec.member), t = rec.tokens || {};
  const dur = t.duration_ms ? `${Math.round(t.duration_ms / 60000)} min` : (rec.status === 'started' ? 'running' : '--');
  const live = rec.status === 'started', base = repoBase();
  const links = [rec.pr && base ? `<a href="${base}/pull/${esc(rec.pr)}" target="_blank">PR #${esc(rec.pr)}</a>` : '', rec.item_id && base ? `<a href="${base}/issues/${esc(rec.item_id)}" target="_blank">issue #${esc(rec.item_id)}</a>` : ''].filter(Boolean).join(' · ');
  side.innerHTML = `
    <div class="top"><span class="name">${esc((m && m.spec.emoji) || '')} ${esc(rec.member)}</span><button class="close" data-act="closeRun" aria-label="close">×</button></div>
    <div class="when">${esc(ago(rec.ts))} · ${esc(new Date(rec.ts * 1000).toLocaleString('en-US', {timeZone: 'America/Chicago', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}))} CT · <span class="badge ${statusClass(rec)}">${esc(live ? 'running' : rec.status || '')}</span></div>
    <dl class="facts"><dt>Took</dt><dd>${esc(dur)}</dd><dt>Cost</dt><dd>${t.cost_usd !== undefined ? esc(money(t.cost_usd)) : '--'}${t.num_turns ? ` · ${esc(t.num_turns)} turns` : ''}</dd>${links ? `<dt>Links</dt><dd>${links}</dd>` : ''}<dt>Run</dt><dd>${rec.run_id ? `<button class="runid" data-act="copyRun" data-run-id="${esc(rec.run_id)}" title="click to copy this run id and its link">${esc(rec.run_id)}<span class="rc">copy</span></button>` : '--'}</dd></dl>
    ${live ? `<h2>Report</h2><div class="none">still running; the outcome and report land here when the pass ends</div><h2>Live transcript</h2><pre class="live" id="liveLog">loading…</pre>` : `${rec.plain ? section('In plain words', rec.plain, 'plain') : ''}${section('Outcome', rec.outcome)}${section('Evidence', rec.evidence)}${rec.report ? section('Report', rec.report, 'report') : `<h2>Report</h2><div class="none">no written report for this run</div>`}${critiqueSection(rec.self_critique)}`}`;

}
async function loadLive(rec) {
  try { const d = await getJSON(`/api/pass_log?member=${encodeURIComponent(rec.member)}&n=0`); const el = $('liveLog'); if (!el) return;
    const lines = (d.lines || []).slice(-60).map(l => typeof l === 'string' ? l : (l.text || JSON.stringify(l)));
    el.textContent = lines.length ? lines.join('\n') : 'no transcript yet'; el.scrollTop = el.scrollHeight;

function openRun(id) { OPEN_RUN = id; setRunHash(id); renderRun(); }

// Keep the URL in step with the open panel without pushing a history entry per click --
// replaceState means Back still leaves the page rather than walking back through every run
// the reader opened.
function setRunHash(id) {
  const base = PAGE === 'roster' ? '#roster' : '';
  const next = id ? `${base}${base ? '&' : '#'}run=${encodeURIComponent(id)}` : (base || location.pathname);
  if (location.hash !== next && !(next === location.pathname && !location.hash)) history.replaceState(null, '', next);
}
// What a copied run id is FOR: pasting it somewhere another person or session can act on it.

async function copyRun(id, el) {
  const link = `${location.origin}${location.pathname}#run=${encodeURIComponent(id)}`;

    await navigator.clipboard.writeText(`${id}\n${link}`);

document.addEventListener('keydown', e => { if (e.key === 'Escape' && OPEN_RUN) closeRun(); });
$('sideBack').addEventListener('click', closeRun);
window.addEventListener('hashchange', () => {
  PAGE = /(^|[#&])roster\b/.test(location.hash) ? 'roster' : 'home';
  const r = runFromHash();
  if (r !== OPEN_RUN) { OPEN_RUN = r; renderRun(); }
  renderChrome();
});

document.addEventListener('click', async e => {
  const row = e.target.closest('tr.agent[data-agent]');
  if (row) { OPEN = OPEN === row.dataset.agent ? null : row.dataset.agent; renderAgents(); return; }
  const runEl = e.target.closest('.run[data-run]');
  if (runEl && runEl.dataset.run) { openRun(runEl.dataset.run); return; }
  const copyEl = e.target.closest('[data-act="copyRun"]');
  if (copyEl) { copyRun(copyEl.dataset.runId, copyEl); return; }
  if (e.target.closest('[data-act="closeRun"]')) { closeRun(); return; }
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const box = btn.closest('.drawer'), err = box && box.querySelector('[data-act="err"]');
  btn.disabled = true;
  try {
    if (btn.dataset.act === 'rerun') { await postJSON('/api/run_now', {member: btn.dataset.member}); btn.textContent = 'Started'; }
    else if (btn.dataset.act === 'toggle') { await postJSON('/api/fleet_toggle', {target: btn.dataset.member, value: btn.dataset.on !== 'true'}); await load(); }
    else if (btn.dataset.act === 'fleet') { await postJSON('/api/fleet_toggle', {target: 'fleet', value: btn.dataset.on !== 'true'}); await load(); btn.disabled = false; }
  } catch (ex) {
    if (err) err.textContent = ex.message; else $("build").textContent = ex.message;
    btn.disabled = false;
  }
});

load().catch(ex => { $('stats').innerHTML = `<div class="err">${esc(ex.message)}</div>`; });
setInterval(() => load().catch(() => {}), 30000);
</script>
</body>
</html>
