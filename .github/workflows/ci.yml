        run: python3 scripts/test_run_member_ceiling_computation.py
      - name: run test_alert_store.py
        run: python3 scripts/test_alert_store.py
      - name: run test_board_github.py
        run: python3 scripts/test_board_github.py
      - name: run test_closes_gate.py
        run: python3 scripts/test_closes_gate.py
      - name: run test_console_api_stubs_cover_the_pages.py
        run: python3 scripts/test_console_api_stubs_cover_the_pages.py
      - name: run test_console_number_unit.py
