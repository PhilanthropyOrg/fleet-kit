name: CI

# Runs selftest.py on every PR into main. Required check for branch protection + auto-merge
# (see docs/ops/fleet-kit-governance.md). Mirrors nonprofit-atlas's ci.yml shape -- same
# pattern, different repo, since fleet-kit had no CI at all before this (confirmed live
# 2026-08-28: every fleet-kit merge to date was a direct human push to main, no check ever
# ran automatically).
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This is the ONLY required status check (branch protection + auto-merge key on the name
  # "selftest" -- see docs/ops/fleet-kit-governance.md). gh#804: it must never run a step that
  # reaches a third party, or that third party's uptime becomes this repo's ability to merge
  # anything -- an apt 403 from packages.microsoft.com blocked PR #801 (one markdown file, no
  # relation to Playwright) from merging (this was back when the repo still had a merge queue,
  # since deleted -- fleet-kit#1193). Playwright's system-dependency install lives in the
  # playwright-tests job below instead, which still runs on every PR but is not required.
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install selftest.py's own import-time deps
        run: pip install pyyaml
      - name: run selftest.py
        run: python3 scripts/selftest.py
      - name: run test_ci_required_check_gh804.py
        run: python3 scripts/test_ci_required_check_gh804.py
      - name: run test_vp_labels.py
        run: python3 scripts/test_vp_labels.py
      - name: run test_dead_end_label.py
        run: python3 scripts/test_dead_end_label.py
      - name: run members/librarian/test_librarian.py
        run: python3 members/librarian/test_librarian.py
      - name: run test_worktree_lock.py
        run: python3 scripts/test_worktree_lock.py
      - name: run test_webhook_merged_pr.py
        run: python3 scripts/test_webhook_merged_pr.py
      - name: run test_notify_reif_hq.py
        run: python3 scripts/test_notify_reif_hq.py
      - name: run test_prod_runtime.py
        run: python3 scripts/test_prod_runtime.py
      - name: run test_coverage_map.py
        run: python3 scripts/test_coverage_map.py
      - name: run test_webhook_prod_alert.py
        run: python3 scripts/test_webhook_prod_alert.py
      - name: run test_ci_runs_every_test_file.py
        run: python3 scripts/test_ci_runs_every_test_file.py
      - name: run test_pack_batches_area.py
        run: python3 scripts/test_pack_batches_area.py
      - name: run test_issue_cluster.py
        run: python3 scripts/test_issue_cluster.py
      - name: run test_scoreboard.py
        run: python3 scripts/test_scoreboard.py
      - name: run test_resolved_per_hour.py
        run: python3 scripts/test_resolved_per_hour.py
      - name: run test_issues_per_hour_chart.py
        run: python3 scripts/test_issues_per_hour_chart.py
      - name: run test_account_pool_config_dir.py
        run: python3 scripts/test_account_pool_config_dir.py
      - name: run test_account_pool_order.py
        run: python3 scripts/test_account_pool_order.py
      - name: run test_account_pool_calibrating_unbilled.py
        run: python3 scripts/test_account_pool_calibrating_unbilled.py
      - name: run test_account_pool_other_gate_last_account.py
        run: python3 scripts/test_account_pool_other_gate_last_account.py
      - name: run test_account_pool_timeout_no_failover.py
